<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Carrera al altar — Cami &amp; Sebas</title>
  <meta name="description" content="Todos corren por el pasillo: gana quien toque más rápido. Un juego en vivo de la boda de Cami &amp; Sebas.">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="Carrera al altar">
  <meta property="og:description" content="Todos corren por el pasillo: gana quien toque más rápido.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://camiysebas.online/assets/Logo.webp">
  <link rel="icon" type="image/webp" href="../../../assets/Logo.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Ephesis&family=Montserrat:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="../../juegos.css?v=21">
</head>

<body>
  <main class="sheet game">
    <header class="hud">
      <a class="hud-back" href="../../" data-keep-query>← Juegos</a>
      <h1 class="hud-title">Carrera al altar</h1>
      <div class="hud-side">
        <p class="hud-info" id="online"></p>
        <button class="hud-sound" type="button" data-sound-toggle>♪</button>
      </div>
    </header>

    <div class="stage stage-lights" id="stage">
      <div class="multi-play" id="play">
        <div class="scene is-tall"><canvas id="scene" aria-label="La carrera"></canvas></div>
        <p class="multi-note" id="you"></p>
        <div class="tap-row">
          <button class="tap-btn is-side" id="jump" type="button">Salta</button>
          <button class="tap-btn" id="run" type="button">¡Corre!</button>
        </div>
      </div>

      <section class="overlay" id="lobby">
        <div class="overlay-inner">
          <p class="eyebrow">Multijugador en vivo</p>
          <h2 class="script-title">Carrera al altar</h2>
          <ul class="rules">
            <li><span class="mark" aria-hidden="true">✦</span> <span>Toca <b>¡Corre!</b> tan rápido como puedas.</span></li>
            <li><span class="mark" aria-hidden="true">✦</span> <span>Toca <b>Salta</b> justo antes de cada torta, o te tropiezas.</span></li>
            <li><img src="../../../assets/juegos/sprites/arco.svg" alt="" width="28" height="28"> <span>Los tres primeros en llegar al <b>altar</b> suben al podio.</span></li>
          </ul>
          <div class="dress-faces" data-look role="group" aria-label="Con quién corres">
            <button type="button" data-who="sebas">Sebas</button>
            <button type="button" data-who="cami">Cami</button>
          </div>
          <p class="multi-count" id="lobbyCount"></p>
          <ul class="multi-chips" id="lobbyPlayers"></ul>
          <div class="overlay-actions">
            <button class="btn btn-primary" id="startBtn" type="button" disabled>Empezar</button>
            <button class="btn btn-link" id="inviteBtn" type="button">Invitar a la sala</button>
          </div>
          <p class="multi-status" id="status" aria-live="polite"></p>
        </div>
      </section>

      <section class="overlay" id="results" hidden>
        <div class="overlay-inner">
          <p class="eyebrow">Resultado</p>
          <h2 class="results-headline" id="headline"></h2>
          <ol class="podium-list" id="ranking"></ol>
          <p class="multi-status" id="nextIn"></p>
          <a class="btn btn-link" href="../../" data-keep-query>Otros juegos</a>
        </div>
      </section>
    </div>
  </main>

  <script src="../../juegos.js?v=16"></script>
  <script src="../../sala.js?v=4"></script>
  <script src="game.js?v=3"></script>
  <script src="../../../buzon.js?v=1" defer></script>
</body>

</html>
