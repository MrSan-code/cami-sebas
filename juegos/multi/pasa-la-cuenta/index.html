<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pasa la cuenta — Cami &amp; Sebas</title>
  <meta name="description" content="La cuenta de la boda va de mano en mano. Que no te quede a ti. Un juego en vivo de la boda de Cami &amp; Sebas.">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="Pasa la cuenta">
  <meta property="og:description" content="La cuenta de la boda va de mano en mano. Que no te quede a ti.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://camiysebas.online/assets/Logo.webp">
  <link rel="icon" type="image/webp" href="../../../assets/Logo.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Ephesis&family=Montserrat:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="../../juegos.css?v=21">
</head>

<body>
  <main class="sheet game">
    <header class="hud">
      <a class="hud-back" href="../../" data-keep-query>← Juegos</a>
      <h1 class="hud-title">Pasa la cuenta</h1>
      <div class="hud-side">
        <p class="hud-info" id="online"></p>
        <button class="hud-sound" type="button" data-sound-toggle>♪</button>
      </div>
    </header>

    <div class="stage stage-lights" id="stage">
      <div class="multi-play" id="play">
        <p class="multi-note" id="round"></p>
        <div class="fuse" id="fuse" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="bill-card" id="pad" data-stage="idle">
          <img class="bill" src="../../../assets/juegos/sprites/cuenta.svg" alt="">
          <p class="bill-title" id="padText"></p>
          <p class="bill-sub" id="padSub"></p>
          <div class="targets" id="targets"></div>
        </div>
        <ul class="multi-chips ring" id="ring"></ul>
      </div>

      <section class="overlay" id="lobby">
        <div class="overlay-inner">
          <p class="eyebrow">Multijugador en vivo</p>
          <h2 class="script-title">Pasa la cuenta</h2>
          <ul class="rules">
            <li><img src="../../../assets/juegos/sprites/cuenta.svg" alt="" width="28" height="28"> <span>Si te llega <b>la cuenta</b>, elige a quién se la pasas.</span></li>
            <li><span class="mark" aria-hidden="true">✦</span> <span>La mecha avanza: cuando se acaba, a quien la tenga <b>le toca pagar</b> y sale.</span></li>
            <li><span class="mark" aria-hidden="true">✦</span> <span>Gana quien <b>se salve</b> hasta el final.</span></li>
          </ul>
          <p class="multi-count" id="lobbyCount"></p>
          <ul class="multi-chips" id="lobbyPlayers"></ul>
          <div class="overlay-actions">
            <button class="btn btn-primary" id="startBtn" type="button" disabled>Empezar</button>
            <button class="btn btn-link" id="inviteBtn" type="button">Invitar a la sala</button>
          </div>
          <p class="multi-status" id="status" aria-live="polite"></p>
        </div>
      </section>

      <section class="overlay" id="results" hidden>
        <div class="overlay-inner">
          <p class="eyebrow">Resultado</p>
          <h2 class="results-headline" id="headline"></h2>
          <ol class="podium-list" id="ranking"></ol>
          <p class="multi-status" id="nextIn"></p>
          <a class="btn btn-link" href="../../" data-keep-query>Otros juegos</a>
        </div>
      </section>
    </div>
  </main>

  <script src="../../juegos.js?v=16"></script>
  <script src="../../sala.js?v=4"></script>
  <script src="game.js?v=3"></script>
  <script src="../../../buzon.js?v=1" defer></script>
</body>

</html>
