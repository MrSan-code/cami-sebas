<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Memoria de parejas — Cami &amp; Sebas</title>
  <meta name="description" content="Encuentra todas las parejas. Un juego de la boda de Cami &amp; Sebas.">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="Memoria de parejas">
  <meta property="og:description" content="¿En cuántos intentos las encuentras? Cami &amp; Sebas, 14.11.2026">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://camiysebas.online/assets/Logo.webp">
  <link rel="icon" type="image/webp" href="../../assets/Logo.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Ephesis&family=Montserrat:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="../juegos.css?v=9">
</head>

<body>
  <main class="sheet game">
    <header class="hud">
      <a class="hud-back" href="../" data-keep-query>← Juegos</a>
      <p class="hud-score"><b id="score">0</b><span>Intentos</span></p>
      <div class="hud-side">
        <p class="hud-info" id="time">0:00</p>
        <button class="hud-sound" type="button" data-sound-toggle>♪</button>
      </div>
    </header>

    <div class="progress" aria-hidden="true"><i id="progress"></i></div>

    <div class="stage stage-board" id="stage">
      <div class="memory-grid" id="grid"></div>

      <section class="overlay" id="startPanel">
        <div class="overlay-inner">
          <p class="eyebrow" data-guest="{names}, a ver esa memoria">A ver esa memoria</p>
          <h1 class="script-title">Memoria de parejas</h1>
          <ul class="rules">
            <li><img src="../../assets/juegos/sprites/cartas.svg" alt="" width="28" height="28"> <span>Tienes un momento para <b>memorizar</b> el tablero.</span></li>
            <li><span class="mark" aria-hidden="true">✦</span> <span>Voltea dos cartas por turno y encuentra las <b>parejas</b>.</span></li>
            <li><span class="mark" aria-hidden="true">✦</span> <span>Menos intentos, más <b>estrellas</b>.</span></li>
          </ul>
          <div class="overlay-actions">
            <button class="btn btn-primary" id="startBtn" type="button">Jugar</button>
          </div>
        </div>
      </section>

      <section class="overlay" id="overPanel" hidden>
        <div class="overlay-inner">
          <p class="eyebrow" id="overTitle"></p>
          <p class="final-score" id="finalScore">0</p>
          <p class="stars" id="stars" hidden></p>
          <p class="body-txt" id="verdict"></p>
          <p class="final-best" id="finalBest"></p>
          <div class="overlay-actions">
            <button class="btn btn-primary" id="againBtn" type="button">Jugar otra vez</button>
            <button class="btn btn-ghost" id="shareBtn" type="button">Retar a alguien</button>
            <a class="btn btn-link" href="../" data-keep-query>Otros juegos</a>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="../juegos.js?v=5"></script>
  <script src="game.js?v=2"></script>
</body>

</html>
