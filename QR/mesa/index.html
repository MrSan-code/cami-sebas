<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Busca tu mesa — Cami &amp; Sebas</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f3ec">
  <link rel="icon" type="image/webp" href="../../assets/Logo.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Ephesis&family=Montserrat:wght@400;500;600&family=Cormorant+Garamond:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../qr.css">
  <script>
    // Unidentified guests start at the welcome page. If storage is blocked, let them in.
    (function () {
      try {
        var guest = JSON.parse(localStorage.getItem('cys-juegos:guest'));
        if (!guest || !guest.id) location.replace('../');
      } catch (e) { /* storage unavailable */ }
    })();
  </script>
</head>

<body>
  <header class="topbar">
    <a class="back" href="../">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6" />
      </svg>
      Inicio
    </a>
    <img class="topbar-logo" src="../../assets/Logo.webp" alt="Cami &amp; Sebas" width="976" height="1088">
  </header>

  <main class="wrap">
    <div class="sec-head">
      <p class="sec-kicker">Tu lugar</p>
      <h1 class="sec-title">Busca tu mesa</h1>
    </div>

    <div class="card" id="mine" hidden>
      <h3 id="mineName"></h3>
      <p id="mineTable"></p>
    </div>

    <section class="plan" id="plan">
      <p class="plan-where" id="planWhere">Toca un nombre para verlo en el plano</p>
      <svg id="planSvg" viewBox="0 0 300 330" role="img" aria-label="Plano de las mesas"></svg>
      <p class="plan-legend" id="planLegend" hidden><i></i><span id="planWho"></span></p>
      <p class="plan-legend">Izquierda y derecha, entrando al salón.</p>
    </section>

    <p class="sec-note" style="text-align:center;margin-bottom:12px" id="searchNote">Escribe tu nombre o apellido</p>

    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
      <input id="q" type="search" placeholder="Ej. Ana Díaz" autocomplete="off" aria-label="Nombre del invitado">
    </label>

    <div class="results-box" id="resultsBox" hidden>
      <ul class="results" id="results"></ul>
    </div>
  </main>

  <footer>
    <small>Con amor</small>
    <span class="sig">Cami &amp; Sebas</span>
  </footer>

  <script src="../qr.js"></script>
  <script>
    (function () {
      // Floor plan, from the seating chart (UBICACION DE MESA.pdf, 8 Nov 2026).
      // Long tables list each side top to bottom; round tables give each seat's angle
      // in degrees (0 = right, 90 = down). Guests not listed here have no table.
      var PLAN = [
        { table: 1, round: [112, 48], seats: [
          ['alvaro-sanchez-diaz', -90], ['verenice-jeanethe-sanabria-gomez', -140],
          ['yesika-katerine-sanchez-sanabria', 180], ['andres-acosta', 140]] },
        { table: 1, round: [150, 58], seats: [
          ['jonathan-sebastian-sanchez', -110], ['maria-camila-diaz', -70],
          ['alejandra-ternurita', 130], ['julian-david-sanchez-sanabria', 90], ['juan-david-diaz', 50]] },
        { table: 1, round: [188, 48], seats: [
          ['nancy-rangel', -125], ['manuel-bernardo-diaz', -80], ['manuel-felipe-diaz', -35],
          ['alejandra', 10], ['ali-milena-diaz', 50]] },
        { table: 2, rect: [34, 98],
          left: ['pablo-fernandez', 'daniela-alvarado-sierra', 'miguel-angel-garcia-calderon', 'alejandro-bohorquez'],
          right: ['juan-camilo-torres', 'oscar-ferney-gallo', 'sebastian-lopez-agudelo', 'viviana-paola-uribe-orozco'] },
        { table: 3, rect: [34, 160],
          left: ['laura-carolina-forigua', 'diego-ferreira', 'alejandro-arevalo-nocua', 'gabriela-leon-celis'],
          right: ['tatiana-arbelaez-parra', 'jorge-ulises-useche', 'oscar-adrian-bautista-castaneda', 'yinna-paola-orjuela-marcelo'],
          foot: 'jose-jimenez' },
        { table: 4, rect: [137, 160],
          left: ['maria-apolonia-perez-nova', 'luis-alexander-sanabria-gomez', 'milena-suancha-verano', 'mariana-sanabria-suancha'],
          right: ['aura-lucia-rangel', 'teresa-rangel', 'cesar-rangel', 'melisa'] },
        { table: 5, rect: [137, 222],
          left: ['carlos-garavito', 'claudia-sanabria-gomez', 'rosa-mireya-sanabria-gomez', 'laura'],
          right: ['daniel-sisa', 'dario', 'cindy', 'julian-rangel'],
          foot: 'steven-rodriguez-rodriguez' },
        { table: 6, rect: [240, 98],
          left: ['nathaly-lagos', 'katerine-prada', 'jesus-david-saavedra', 'juan-camilo-franco'],
          right: ['santiago-andres-hernandez', 'daniel', 'maria-fernanda-chacon', 'lorena-andrea-acuna'] },
        { table: 7, rect: [240, 160],
          left: ['diana-marcela-ruiz', 'jorge-patarroyo', 'valentina-martinez', 'maria-jose-pinto'],
          right: ['jhon-mario', 'natalia-rueda', 'angie-poveda', 'nicolas-duenas'] }
      ];

      var WHERE = {
        1: 'La mesa de los novios, al fondo del salón',
        2: 'A la izquierda, cerca de los novios',
        3: 'A la izquierda, cerca de la entrada',
        4: 'En el centro, cerca de los novios',
        5: 'En el centro, cerca de la entrada',
        6: 'A la derecha, cerca de los novios',
        7: 'A la derecha, cerca de la entrada'
      };

      var TABLE_W = 26, TABLE_H = 62, ROUND_R = 18, SEAT_R = 5, SEAT_GAP = 9;
      var SVG_NS = 'http://www.w3.org/2000/svg';

      function el(name, attrs, parent) {
        var node = document.createElementNS(SVG_NS, name);
        Object.keys(attrs).forEach(function (k) { node.setAttribute(k, attrs[k]); });
        if (parent) parent.appendChild(node);
        return node;
      }

      // guest id -> { table, seat element }, filled while drawing
      var SEATS = {};

      function drawPlan() {
        var svg = document.getElementById('planSvg');
        el('rect', { class: 'room', x: 4, y: 4, width: 292, height: 304, rx: 8 }, svg);
        // The entrance: a gap in the bottom wall, facing the couple's table
        el('rect', { x: 118, y: 304, width: 64, height: 8, fill: '#fff' }, svg);
        el('path', { class: 'entry', d: 'M150 324 V312 M145 317 L150 312 L155 317' }, svg);
        el('text', { class: 'room-note', x: 176, y: 321 }, svg).textContent = 'ENTRADA';
        PLAN.forEach(function (t) {
          var group = el('g', { 'data-table': t.table }, svg);
          var spots = [];
          if (t.round) {
            var cx = t.round[0], cy = t.round[1], d = ROUND_R + SEAT_GAP;
            el('circle', { class: 'tbl', cx: cx, cy: cy, r: ROUND_R }, group);
            el('text', { class: 'tbl-no', x: cx, y: cy }, group).textContent = t.table;
            t.seats.forEach(function (s) {
              var a = s[1] * Math.PI / 180;
              spots.push([s[0], cx + d * Math.cos(a), cy + d * Math.sin(a)]);
            });
          } else {
            var x = t.rect[0], y = t.rect[1], step = TABLE_H / 4;
            el('rect', { class: 'tbl', x: x, y: y, width: TABLE_W, height: TABLE_H, rx: 3 }, group);
            el('text', { class: 'tbl-no', x: x + TABLE_W / 2, y: y + TABLE_H / 2 }, group).textContent = t.table;
            t.left.forEach(function (id, i) { spots.push([id, x - SEAT_GAP, y + step * (i + .5)]); });
            t.right.forEach(function (id, i) { spots.push([id, x + TABLE_W + SEAT_GAP, y + step * (i + .5)]); });
            if (t.foot) spots.push([t.foot, x + TABLE_W / 2, y + TABLE_H + SEAT_GAP]);
          }
          spots.forEach(function (p) {
            var seat = el('circle', { class: 'seat', cx: p[1].toFixed(1), cy: p[2].toFixed(1), r: SEAT_R }, svg);
            SEATS[p[0]] = { table: t.table, seat: seat };
          });
        });
      }

      function tableLabel(id) {
        return SEATS[id] ? 'Mesa ' + SEATS[id].table : null;
      }

      // Highlights one guest's seat and table; returns false when they have no table
      function showOnPlan(id, who) {
        var svg = document.getElementById('planSvg');
        svg.querySelectorAll('.is-mine').forEach(function (n) { n.classList.remove('is-mine'); });
        var spot = SEATS[id];
        if (!spot) return false;
        spot.seat.classList.add('is-mine');
        svg.querySelectorAll('[data-table="' + spot.table + '"]').forEach(function (g) { g.classList.add('is-mine'); });
        // Draw the highlighted seat last so it sits above its neighbours
        svg.appendChild(spot.seat);
        document.getElementById('planWhere').textContent = 'Mesa ' + spot.table + ' · ' + WHERE[spot.table];
        document.getElementById('planWho').textContent = who;
        document.getElementById('planLegend').hidden = false;
        return true;
      }

      drawPlan();

      /* ---------- The signed-in guest's own table ---------- */
      var guest = QR.me();
      if (guest) {
        document.getElementById('mine').hidden = false;
        document.getElementById('mineName').textContent = QR.firstName(guest.name) + ', tu mesa es';
        document.getElementById('mineTable').textContent =
          tableLabel(guest.id) || 'Pregunta a nuestro equipo en la entrada';
        document.getElementById('searchNote').textContent = '¿Buscas a alguien más?';
        showOnPlan(guest.id, 'Tu puesto');
      }

      /* ---------- Search any guest ---------- */
      var input = document.getElementById('q');
      var box = document.getElementById('resultsBox');
      var list = document.getElementById('results');
      var guests = [];

      function render() {
        var matches = QR.search(guests, input.value);
        list.innerHTML = '';
        if (!matches) { box.hidden = true; return; }
        box.hidden = false;

        if (!matches.length) {
          list.innerHTML = '<li class="results-empty">No encontramos ese nombre. Pregunta a nuestro equipo en la entrada.</li>';
          return;
        }

        matches.forEach(function (g) {
          var li = document.createElement('li');
          var label = tableLabel(g.id);
          var row = li;
          if (label) {
            // Seated guests open on the plan
            row = document.createElement('button');
            row.type = 'button';
            row.className = 'seat-btn';
            row.addEventListener('click', function () {
              showOnPlan(g.id, 'Puesto de ' + QR.firstName(g.name));
              list.querySelectorAll('.is-shown').forEach(function (b) { b.classList.remove('is-shown'); });
              row.classList.add('is-shown');
              document.getElementById('plan').scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
            li.appendChild(row);
          }
          var name = document.createElement('span');
          name.textContent = g.name;
          var table = document.createElement('span');
          table.className = label ? 'table-no' : 'pending';
          table.textContent = label || 'Sin mesa';
          row.appendChild(name);
          row.appendChild(table);
          list.appendChild(li);
        });
      }

      input.addEventListener('input', render);

      QR.loadGuests('../../juegos/invitados.json').then(function (data) {
        guests = data;
        if (input.value) render();
      });
    })();
  </script>
  <script src="../../buzon.js?v=1" defer></script>
</body>

</html>
